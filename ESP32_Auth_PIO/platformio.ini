; Physical board: ESP32-C3 SuperMini (silkscreen HW-466AB), ~22x18 mm, USB-C.
; There is no upstream PlatformIO profile for it; esp32-c3-devkitm-1 is used
; because it matches the chip (ESP32-C3) and the 4 MB flash. The two USB flags
; below are what the SuperMini needs: it exposes the chip's native USB, so
; CDC-on-boot gives the serial console over the same connector used to flash.
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	; Recorded with benchmark results: a deleted or hoisted loop would otherwise
	; be indistinguishable from fast code (design.md Decision 3).
	-D BUILD_OPT_LEVEL='"-Os"'
	; Dual power model. Ratios are invariant to both; only absolute energy moves.
	; PAPER: 19.9 mA @ 5 V, reference paper section VI-A.
	; DEVICE: 25 mA @ 3.3 V, ESP32-C3 CPU active @160 MHz, WiFi associated.
	-D PAPER_POWER_MW=99.5
	-D DEVICE_POWER_MW=82.5
